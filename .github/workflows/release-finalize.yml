name: Release Finalize

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  finalize:
    # module-release-finalize.yml gates internally on merged + release/v*.
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    # Pinned to a core release tag (workbench-core D78); Dependabot bumps it.
    # Writes use the minted App token, never GITHUB_TOKEN.
    permissions:
      contents: read
    uses: GingerGraham/workbench-core/.github/workflows/module-release-finalize.yml@v2.21.1
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
