name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_ref:
        description: "workbench-core ref to test against (default: main)"
        required: false

jobs:
  guard:
    name: Check placeholders substituted
    runs-on: ubuntu-latest
    outputs:
      substituted: ${{ steps.check.outputs.substituted }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        # __MODULE_OWNER__/__MODULE_REPO__/__MODULE_SHORT__ are only ever unsubstituted in
        # this template repo itself, or in a generated repo's first push
        # before template-bootstrap.yml has committed its substitution --
        # module-ci would otherwise run against a literal placeholder
        # module name. This file (and release.yml) is excluded from its
        # own scan: this detection line's literal token strings are
        # permanent code, not substitutable content, so without the
        # exclusion the guard would keep seeing them after every other
        # real placeholder is long gone and report "unsubstituted"
        # forever, permanently disabling CI.
        run: |
          set -euo pipefail
          if grep -rIq -e '__MODULE_OWNER__' -e '__MODULE_REPO__' -e '__MODULE_SHORT__' \
            --exclude-dir=.git --exclude=ci.yml --exclude=release.yml .; then
            echo "substituted=false" >> "$GITHUB_OUTPUT"
          else
            echo "substituted=true" >> "$GITHUB_OUTPUT"
          fi

  module-ci:
    needs: guard
    if: needs.guard.outputs.substituted == 'true'
    # core_ref defaults to main, not module-ci.yml's own "latest published
    # release" default: this feature lives entirely under .github/, which
    # core's own release automation never version-bumps for (it only bumps
    # on changes to registered bin/lib/bootstrap.sh files) -- so a core
    # release containing this workflow will never exist to default to.
    uses: GingerGraham/workbench-core/.github/workflows/module-ci.yml@main
    with:
      module_name: __MODULE_SHORT__
      core_ref: ${{ github.event.inputs.core_ref || 'main' }}
